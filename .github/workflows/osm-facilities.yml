name: refresh-osm-facilities

# Extracts schools & parks for Türkiye from the Geofabrik OpenStreetMap extract
# (or, if plate codes are given, downloads just those provinces via Overpass),
# rebuilds the database, runs the tests and commits the updated web-map data
# (docs/data/*.geojson). Start it from the Actions tab → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      provinces:
        description: "Plate codes separated by spaces for an Overpass download (empty = whole country from Geofabrik)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: osm-facilities
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: citygis
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gis -d citygis"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: citygis
      PGUSER: gis
      PGPASSWORD: gis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install osmium
        if: github.event.inputs.provinces == ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Extract schools & parks (Geofabrik, whole country)
        if: github.event.inputs.provinces == ''
        run: python scripts/osm_pbf_facilities.py

      - name: Download schools & parks (Overpass, selected provinces)
        if: github.event.inputs.provinces != ''
        run: python -u scripts/fetch_osm_facilities.py ${{ github.event.inputs.provinces }}

      - name: Build database
        run: python scripts/load_data.py

      - name: Tests
        run: python tests/run_tests.py

      - name: Export web-map data
        run: python scripts/export_web.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update OSM schools & parks layer ($(date -u +%Y-%m-%d))"
          git push
